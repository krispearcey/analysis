<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analysis</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jQuery (Required by Chessboard.js) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Chessboard.js CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <!-- Chess.js (Rules and move validation) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Custom Styles for Evaluation Bar and Lichess Theme -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #161512;
      color: #bababa;
    }

    /* Fixed Lichess Wood Theme Colors */
    .square-55d63 { background-color: #f0d9b5; color: #b58863; }
    .black-3c85d { background-color: #b58863; color: #f0d9b5; }

    /* Eval Bar Styling */
    .eval-bar-container {
      width: 24px;
      height: 100%;
      background-color: #262421; /* Dark (Black advantage) */
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse; /* Bottom-up fill */
      position: relative;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.6);
    }
    
    .eval-bar-fill {
      width: 100%;
      background-color: #ffffff; /* Light (White advantage) */
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .eval-text {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      z-index: 10;
      pointer-events: none;
    }
    
    .eval-text-top { top: 4px; }
    .eval-text-bottom { bottom: 4px; }

    /* Lichess Progress Bar Animation */
    @keyframes engine-progress-shimmer {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }
    
    .progress-active {
      background-image: linear-gradient(90deg, #d97706 0%, #fbbf24 50%, #d97706 100%);
      background-size: 200px 100%;
      animation: engine-progress-shimmer 1.5s infinite linear;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e1c18; }
    ::-webkit-scrollbar-thumb { background: #363431; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4743; }

    /* Move list notation table styles */
    .move-row:nth-child(even) { background-color: rgba(255, 255, 255, 0.02); }
    .move-cell.active-move {
      background-color: #d97706;
      color: #fff;
      font-weight: bold;
      border-radius: 2px;
    }
    .move-cell:hover:not(.active-move) {
      background-color: #2b2824;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center select-none p-2 sm:p-4">

  <!-- Main Content Layout (Vertically & Horizontally Centered) -->
  <main class="w-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-4 items-center my-auto">

    <!-- Left Column: Board + Evaluation Bar (7 cols) -->
    <section class="lg:col-span-7 flex flex-col items-center">
      
      <!-- Board Wrapper with Eval Bar -->
      <div class="flex flex-row items-stretch gap-2 w-full max-w-[580px] aspect-square relative">
        
        <!-- Dynamic Evaluation Bar -->
        <div class="eval-bar-container" id="evalContainer">
          <div id="evalTextTop" class="eval-text eval-text-top text-gray-400"></div>
          <div id="evalBarFill" class="eval-bar-fill" style="height: 50%;"></div>
          <div id="evalTextBottom" class="eval-text eval-text-bottom text-gray-900">0.0</div>
        </div>

        <!-- Chessboard Container -->
        <div class="flex-1 relative aspect-square shadow-2xl rounded overflow-hidden" id="boardWrapper">
          <div id="myBoard" class="w-full h-full"></div>
        </div>

      </div>

      <!-- Toolbar under Board -->
      <div class="w-full max-w-[580px] mt-2.5 flex items-center justify-between bg-[#1e1c18] border border-[#2e2c28] rounded p-1 text-sm">
        <div class="flex items-center space-x-1">
          <button id="btnFlip" title="Flip Board" class="px-3 py-1.5 rounded hover:bg-[#2e2c28] text-gray-300 hover:text-white transition">
            <i class="fa-solid fa-arrows-rotate mr-1"></i> Flip
          </button>
          <button id="btnReset" title="Reset Position" class="px-3 py-1.5 rounded hover:bg-[#2e2c28] text-gray-300 hover:text-white transition">
            <i class="fa-solid fa-rotate-left mr-1"></i> Reset
          </button>
        </div>

        <div class="flex items-center space-x-1">
          <button id="btnFirst" title="First Move (Up Arrow)" class="px-3 py-1.5 rounded hover:bg-[#2e2c28] text-gray-300 hover:text-white transition">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button id="btnPrev" title="Previous Move (Left Arrow)" class="px-3 py-1.5 rounded hover:bg-[#2e2c28] text-gray-300 hover:text-white transition">
            <i class="fa-solid fa-caret-left text-lg"></i>
          </button>
          <button id="btnNext" title="Next Move (Right Arrow)" class="px-3 py-1.5 rounded hover:bg-[#2e2c28] text-gray-300 hover:text-white transition">
            <i class="fa-solid fa-caret-right text-lg"></i>
          </button>
          <button id="btnLast" title="Last Move (Down Arrow)" class="px-3 py-1.5 rounded hover:bg-[#2e2c28] text-gray-300 hover:text-white transition">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>
      </div>

    </section>

    <!-- Right Column: Engine Lines, Move Tree, PGN/FEN panel (5 cols) -->
    <section class="lg:col-span-5 flex flex-col gap-3 h-full">

      <!-- Top Engine Lines & Progress Gauge Panel -->
      <div class="bg-[#1e1c18] border border-[#2e2c28] rounded-md p-3 shadow relative overflow-hidden">
        
        <!-- Engine Header Info -->
        <div class="flex items-center justify-between border-b border-[#2e2c28] pb-2 mb-2">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-microchip text-amber-500 text-sm"></i>
            <span class="font-bold text-gray-200 text-xs tracking-wider uppercase">Stockfish 16+</span>
            <span id="engineStatus" class="text-[10px] bg-amber-950/60 text-amber-400 px-1.5 py-0.5 rounded border border-amber-700/40">Initializing</span>
          </div>
          <div class="flex items-center space-x-3">
            <div class="text-xs text-gray-400 font-mono">
              depth <span id="evalDepth" class="font-bold text-amber-400">0</span>/20
            </div>

            <!-- Engine Toggle Switch (Play / Pause Icon Only) -->
            <button id="btnToggleEngine" title="Toggle Engine Analysis" class="w-7 h-6 rounded bg-amber-600/20 text-amber-400 hover:bg-amber-600/30 border border-amber-500/40 flex items-center justify-center transition cursor-pointer">
              <svg id="engineToggleSvg" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Lichess Thinking Progress Bar -->
        <div class="w-full bg-[#262421] h-1 rounded-full mb-3 overflow-hidden relative">
          <div id="engineProgressBar" class="h-full bg-amber-500 w-0 transition-all duration-200 progress-active"></div>
        </div>

        <!-- Top 5 Engine Lines Container -->
        <div id="engineLines" class="space-y-1.5 text-xs font-mono min-h-[140px] max-h-[180px] overflow-y-auto pr-1">
          <div class="text-gray-500 italic py-2">Initializing Stockfish Web Engine...</div>
        </div>
      </div>

      <!-- Move Notation Table Panel -->
      <div class="bg-[#1e1c18] border border-[#2e2c28] rounded-md flex-1 flex flex-col min-h-[220px] shadow">
        <div class="bg-[#262421] px-3 py-2 border-b border-[#2e2c28] font-semibold text-xs text-gray-300 flex justify-between items-center">
          <span class="tracking-wider uppercase text-[11px] text-gray-400">Move Record</span>
          <span id="plyCount" class="text-gray-500 font-mono text-xs">0 Plies</span>
        </div>
        
        <div class="flex-1 overflow-y-auto p-2" id="moveTableContainer">
          <table class="w-full text-sm font-mono text-left border-collapse">
            <thead>
              <tr class="text-gray-500 border-b border-[#2e2c28] text-xs">
                <th class="py-1 px-2 w-12">#</th>
                <th class="py-1 px-2">White</th>
                <th class="py-1 px-2">Black</th>
              </tr>
            </thead>
            <tbody id="moveList">
              <!-- Dynamically populated moves -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- FEN / PGN Import & Export Panel -->
      <div class="bg-[#1e1c18] border border-[#2e2c28] rounded-md p-3 shadow">
        <div class="space-y-2.5">
          
          <!-- FEN Row -->
          <div>
            <label class="block text-[11px] font-semibold uppercase tracking-wider text-gray-400 mb-1">FEN Position</label>
            <div class="flex gap-1">
              <input type="text" id="fenInput" class="flex-1 bg-[#262421] text-xs text-gray-200 font-mono border border-[#3e3b35] rounded px-2 py-1 focus:outline-none focus:border-amber-500" placeholder="Paste FEN position..." />
              <button id="btnLoadFen" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-1 rounded transition">Load</button>
              <button id="btnCopyFen" class="bg-[#262421] hover:bg-[#363431] border border-[#3e3b35] text-gray-300 text-xs px-2 py-1 rounded transition" title="Copy FEN"><i class="fa-regular fa-copy"></i></button>
            </div>
          </div>

          <!-- PGN Row -->
          <div>
            <label class="block text-[11px] font-semibold uppercase tracking-wider text-gray-400 mb-1">PGN Game Notation</label>
            <div class="flex gap-1">
              <textarea id="pgnInput" rows="2" class="flex-1 bg-[#262421] text-xs text-gray-200 font-mono border border-[#3e3b35] rounded px-2 py-1 focus:outline-none focus:border-amber-500 resize-none" placeholder="Paste PGN notation..."></textarea>
              <div class="flex flex-col gap-1">
                <button id="btnLoadPgn" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2 py-1 rounded transition h-full">Load</button>
                <button id="btnCopyPgn" class="bg-[#262421] hover:bg-[#363431] border border-[#3e3b35] text-gray-300 text-xs px-2 py-1 rounded transition" title="Copy PGN"><i class="fa-regular fa-copy"></i></button>
              </div>
            </div>
          </div>

        </div>
      </div>

    </section>

  </main>

  <!-- Notification Toast Container -->
  <div id="toast" class="fixed bottom-4 right-4 bg-amber-600 text-white text-xs px-3 py-2 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50">
    Copied to clipboard!
  </div>

  <!-- JavaScript Logic -->
  <script>
    // --- Application State ---
    const game = new Chess();
    let board = null;
    let moveHistory = []; 
    let currentMoveIndex = -1;
    let isFlipped = false;

    // --- Stockfish Engine State ---
    let stockfishWorker = null;
    let currentPvLines = {}; // MultiPV line data indexed by PV rank (1-5)
    let maxDepthCalculated = 0;
    let isWorkerReady = false;
    let isEngineEnabled = true;
    const TARGET_DEPTH = 20;

    // --- DOM Elements ---
    const evalBarFill = document.getElementById('evalBarFill');
    const evalTextTop = document.getElementById('evalTextTop');
    const evalTextBottom = document.getElementById('evalTextBottom');
    const engineLines = document.getElementById('engineLines');
    const engineStatus = document.getElementById('engineStatus');
    const engineProgressBar = document.getElementById('engineProgressBar');
    const evalDepth = document.getElementById('evalDepth');
    const btnToggleEngine = document.getElementById('btnToggleEngine');
    const engineToggleIcon = document.getElementById('engineToggleIcon');
    const engineToggleText = document.getElementById('engineToggleText');
    const moveList = document.getElementById('moveList');
    const fenInput = document.getElementById('fenInput');
    const pgnInput = document.getElementById('pgnInput');

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    function updateProgress(depth) {
      maxDepthCalculated = depth;
      evalDepth.textContent = depth;
      const percent = Math.min(100, Math.round((depth / TARGET_DEPTH) * 100));
      engineProgressBar.style.width = `${percent}%`;
      
      if (percent >= 100) {
        engineProgressBar.classList.remove('progress-active');
        engineStatus.textContent = 'Complete';
        engineStatus.className = 'text-[10px] bg-gray-800 text-gray-300 px-1.5 py-0.5 rounded border border-gray-700';
      } else {
        engineProgressBar.classList.add('progress-active');
      }
    }

    // --- Stockfish Web Worker ---
    function initStockfishWorker() {
      try {
        const workerScript = `importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');`;
        const blob = new Blob([workerScript], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        stockfishWorker = new Worker(workerUrl);

        stockfishWorker.onmessage = function (e) {
          handleEngineMessage(e.data);
        };

        stockfishWorker.postMessage('uci');
        stockfishWorker.postMessage('setoption name MultiPV value 5');
        stockfishWorker.postMessage('isready');
      } catch (err) {
        console.warn('Local Stockfish worker unavailable, fallback to Lichess Cloud API.', err);
        isWorkerReady = false;
        engineStatus.textContent = 'Cloud API';
      }
    }

    function handleEngineMessage(line) {
      if (typeof line !== 'string') return;

      if (line === 'readyok') {
        isWorkerReady = true;
        engineStatus.textContent = 'Analyzing';
        engineStatus.className = 'text-[10px] bg-amber-950/60 text-amber-400 px-1.5 py-0.5 rounded border border-amber-700/40';
        requestPositionEvaluation();
        return;
      }

      if (line.startsWith('info') && line.includes('multipv') && line.includes(' score ')) {
        parseUciInfoLine(line);
      }
    }

    function parseUciInfoLine(line) {
      const depthMatch = line.match(/\bdepth (\d+)/);
      const multipvMatch = line.match(/\bmultipv (\d+)/);
      const scoreCpMatch = line.match(/\bscore cp (-?\d+)/);
      const scoreMateMatch = line.match(/\bscore mate (-?\d+)/);
      const pvMatch = line.match(/\bpv (.+)/);

      if (!multipvMatch || !pvMatch) return;

      const depth = depthMatch ? parseInt(depthMatch[1], 10) : 0;
      const pvIndex = parseInt(multipvMatch[1], 10);
      const rawMoves = pvMatch[1].trim();

      const isWhiteToMove = game.turn() === 'w';
      let scoreVal = 0;
      let scoreDisplay = "0.0";

      if (scoreCpMatch) {
        let cp = parseInt(scoreCpMatch[1], 10);
        if (!isWhiteToMove) cp = -cp;
        scoreVal = cp / 100;
        scoreDisplay = (scoreVal > 0 ? '+' : '') + scoreVal.toFixed(1);
      } else if (scoreMateMatch) {
        let mate = parseInt(scoreMateMatch[1], 10);
        if (!isWhiteToMove) mate = -mate;
        scoreVal = mate > 0 ? 1000 : -1000;
        scoreDisplay = '#' + mate;
      }

      const { movesSan, firstMove } = convertMovesToSan(rawMoves);

      currentPvLines[pvIndex] = {
        depth: depth,
        scoreVal: scoreVal,
        scoreDisplay: scoreDisplay,
        movesSan: movesSan,
        firstMove: firstMove
      };

      updateProgress(depth);

      if (currentPvLines[1]) {
        updateEvalBar(currentPvLines[1].scoreVal, currentPvLines[1].scoreDisplay);
      }

      renderEngineLinesPanel();
    }

    function renderEngineLinesPanel() {
      engineLines.innerHTML = '';
      const keys = Object.keys(currentPvLines).sort((a, b) => parseInt(a) - parseInt(b));

      if (keys.length === 0) {
        engineLines.innerHTML = '<div class="text-gray-500 italic py-2">Calculating moves...</div>';
        return;
      }

      keys.forEach((key) => {
        const lineData = currentPvLines[key];
        const lineEl = document.createElement('div');
        lineEl.className = "flex items-start space-x-2 bg-[#22201c] hover:bg-[#2e2c28] p-1.5 rounded transition cursor-pointer border border-[#2e2c28] hover:border-amber-500/50 group";
        
        lineEl.innerHTML = `
          <span class="font-bold text-amber-400 w-12 text-right group-hover:text-amber-300">${lineData.scoreDisplay}</span>
          <span class="text-gray-200 font-sans flex-1 truncate group-hover:text-white">${lineData.movesSan}</span>
          <i class="fa-solid fa-play text-[10px] text-gray-600 group-hover:text-amber-400 self-center"></i>
        `;

        lineEl.addEventListener('click', () => {
          if (lineData.firstMove) executeMove(lineData.firstMove);
        });

        engineLines.appendChild(lineEl);
      });
    }

    function executeMove(moveObj) {
      const move = game.move(moveObj);
      if (move === null) return;

      if (currentMoveIndex < moveHistory.length - 1) {
        moveHistory = moveHistory.slice(0, currentMoveIndex + 1);
      }

      moveHistory.push({
        fen: game.fen(),
        san: move.san,
        from: move.from,
        to: move.to
      });

      currentMoveIndex = moveHistory.length - 1;
      board.position(game.fen());
      updateUI();
    }

    // Trigger Analysis (Cloud API + Stockfish engine parallel execution)
    async function requestPositionEvaluation() {
      if (!isEngineEnabled) {
        if (stockfishWorker && isWorkerReady) stockfishWorker.postMessage('stop');
        engineStatus.textContent = 'Paused';
        engineStatus.className = 'text-[10px] bg-yellow-900/40 text-yellow-400 px-1.5 py-0.5 rounded border border-yellow-700/40';
        engineProgressBar.classList.remove('progress-active');
        return;
      }

      currentPvLines = {};
      updateProgress(0);
      engineStatus.textContent = 'Searching';
      engineStatus.className = 'text-[10px] bg-amber-950/60 text-amber-400 px-1.5 py-0.5 rounded border border-amber-700/40';

      if (game.game_over()) {
        engineStatus.textContent = 'Game Over';
        engineStatus.className = 'text-[10px] bg-red-900/40 text-red-400 px-1.5 py-0.5 rounded border border-red-700/40';
        updateProgress(TARGET_DEPTH);
        if (game.in_checkmate()) {
          const evalScore = game.turn() === 'w' ? -1000 : 1000;
          updateEvalBar(evalScore, game.turn() === 'w' ? '#-0' : '#+0');
        } else {
          updateEvalBar(0, '0.0');
        }
        engineLines.innerHTML = '<div class="text-gray-400 py-1 font-sans">Game Over (Draw / Checkmate)</div>';
        return;
      }

      const currentFen = game.fen();

      // Concurrent local Stockfish worker evaluation
      if (isWorkerReady && stockfishWorker) {
        stockfishWorker.postMessage('stop');
        stockfishWorker.postMessage('position fen ' + currentFen);
        stockfishWorker.postMessage(`go depth ${TARGET_DEPTH}`);
      }
    }

    function convertMovesToSan(uciMovesStr) {
      if (!uciMovesStr) return { movesSan: '', firstMove: null };
      const tempGame = new Chess(game.fen());
      const uciArr = uciMovesStr.split(' ');
      const sanArr = [];
      let firstMove = null;

      for (let i = 0; i < Math.min(uciArr.length, 7); i++) {
        const moveStr = uciArr[i];
        if (!moveStr || moveStr.length < 4) break;
        const from = moveStr.substring(0, 2);
        const to = moveStr.substring(2, 4);
        const promotion = moveStr.length > 4 ? moveStr.substring(4, 5) : undefined;
        
        const res = tempGame.move({ from, to, promotion });
        if (res) {
          if (i === 0) firstMove = { from, to, promotion };
          sanArr.push(res.san);
        } else {
          break;
        }
      }
      return { movesSan: sanArr.join(' '), firstMove: firstMove };
    }

    // Dynamic Eval Bar orientation logic
    function updateEvalBar(scoreNum, scoreDisplay) {
      let whitePercent = 50 + (scoreNum * 7);
      if (scoreNum > 10) whitePercent = 95;
      if (scoreNum < -10) whitePercent = 5;

      const fillHeight = isFlipped ? (100 - whitePercent) : whitePercent;
      evalBarFill.style.height = `${fillHeight}%`;

      if (!isFlipped) {
        if (scoreNum >= 0) {
          evalTextBottom.textContent = scoreDisplay;
          evalTextTop.textContent = '';
          evalTextBottom.className = 'eval-text eval-text-bottom text-gray-900 font-bold';
        } else {
          evalTextTop.textContent = scoreDisplay;
          evalTextBottom.textContent = '';
          evalTextTop.className = 'eval-text eval-text-top text-gray-200 font-bold';
        }
      } else {
        if (scoreNum >= 0) {
          evalTextTop.textContent = scoreDisplay;
          evalTextBottom.textContent = '';
          evalTextTop.className = 'eval-text eval-text-top text-gray-900 font-bold';
        } else {
          evalTextBottom.textContent = scoreDisplay;
          evalTextTop.textContent = '';
          evalTextBottom.className = 'eval-text eval-text-bottom text-gray-200 font-bold';
        }
      }
    }

    // --- Chessboard Drag & Drop Callbacks ---
    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
          (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
        return false;
      }
    }

    function onDrop(source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      if (currentMoveIndex < moveHistory.length - 1) {
        moveHistory = moveHistory.slice(0, currentMoveIndex + 1);
      }
      
      moveHistory.push({
        fen: game.fen(),
        san: move.san,
        from: source,
        to: target
      });
      currentMoveIndex = moveHistory.length - 1;

      updateUI();
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function updateUI() {
      fenInput.value = game.fen();
      pgnInput.value = game.pgn();
      renderMoveTable();
      requestPositionEvaluation();
    }

    function renderMoveTable() {
      moveList.innerHTML = '';
      document.getElementById('plyCount').textContent = `${moveHistory.length} Plies`;

      for (let i = 0; i < moveHistory.length; i += 2) {
        const moveNumber = Math.floor(i / 2) + 1;
        const whiteMove = moveHistory[i];
        const blackMove = moveHistory[i + 1];

        const tr = document.createElement('tr');
        tr.className = 'move-row text-xs border-b border-[#2e2c28]/40';

        const tdNum = document.createElement('td');
        tdNum.className = 'py-1.5 px-2 text-gray-500 font-bold';
        tdNum.textContent = `${moveNumber}.`;
        tr.appendChild(tdNum);

        const tdWhite = document.createElement('td');
        tdWhite.className = `py-1.5 px-2 move-cell ${i === currentMoveIndex ? 'active-move' : 'text-gray-200'}`;
        tdWhite.textContent = whiteMove ? whiteMove.san : '';
        tdWhite.addEventListener('click', () => jumpToMove(i));
        tr.appendChild(tdWhite);

        const tdBlack = document.createElement('td');
        tdBlack.className = `py-1.5 px-2 move-cell ${i + 1 === currentMoveIndex ? 'active-move' : 'text-gray-200'}`;
        tdBlack.textContent = blackMove ? blackMove.san : '';
        if (blackMove) {
          tdBlack.addEventListener('click', () => jumpToMove(i + 1));
        }
        tr.appendChild(tdBlack);

        moveList.appendChild(tr);
      }

      const container = document.getElementById('moveTableContainer');
      container.scrollTop = container.scrollHeight;
    }

    function jumpToMove(index) {
      if (index < -1 || index >= moveHistory.length) return;
      
      currentMoveIndex = index;
      if (index === -1) {
        game.reset();
      } else {
        game.load(moveHistory[index].fen);
      }
      
      board.position(game.fen());
      updateUI();
    }

    // --- Dom Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
      const boardConfig = {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      };
      
      board = Chessboard('myBoard', boardConfig);
      $(window).resize(board.resize);

      initStockfishWorker();

      // Engine Toggle Button Handler
      document.getElementById('btnToggleEngine').addEventListener('click', () => {
        isEngineEnabled = !isEngineEnabled;
        const svg = document.getElementById('engineToggleSvg');
        
        if (isEngineEnabled) {
          svg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          btnToggleEngine.className = 'w-7 h-6 rounded bg-amber-600/20 text-amber-400 hover:bg-amber-600/30 border border-amber-500/40 flex items-center justify-center transition cursor-pointer';
          requestPositionEvaluation();
        } else {
          svg.innerHTML = '<path d="M8 5v14l11-7z"/>';
          btnToggleEngine.className = 'w-7 h-6 rounded bg-gray-600/20 text-gray-400 hover:bg-gray-600/30 border border-gray-500/40 flex items-center justify-center transition cursor-pointer';
          
          if (stockfishWorker && isWorkerReady) {
            stockfishWorker.postMessage('stop');
          }
          engineStatus.textContent = 'Paused';
          engineStatus.className = 'text-[10px] bg-yellow-900/40 text-yellow-400 px-1.5 py-0.5 rounded border border-yellow-700/40';
          engineProgressBar.classList.remove('progress-active');
        }
      });

      document.getElementById('btnFlip').addEventListener('click', () => {
        board.flip();
        isFlipped = !isFlipped;
        requestPositionEvaluation();
      });

      document.getElementById('btnReset').addEventListener('click', () => {
        game.reset();
        moveHistory = [];
        currentMoveIndex = -1;
        board.position('start');
        updateUI();
      });

      document.getElementById('btnFirst').addEventListener('click', () => jumpToMove(-1));
      document.getElementById('btnPrev').addEventListener('click', () => jumpToMove(currentMoveIndex - 1));
      document.getElementById('btnNext').addEventListener('click', () => jumpToMove(currentMoveIndex + 1));
      document.getElementById('btnLast').addEventListener('click', () => jumpToMove(moveHistory.length - 1));

      document.getElementById('btnLoadFen').addEventListener('click', () => {
        const fen = fenInput.value.trim();
        if (game.load(fen)) {
          moveHistory = [];
          currentMoveIndex = -1;
          board.position(fen);
          updateUI();
          showToast('FEN Loaded!');
        } else {
          showToast('Invalid FEN String');
        }
      });

      document.getElementById('btnLoadPgn').addEventListener('click', () => {
        const pgn = pgnInput.value.trim();
        if (game.load_pgn(pgn)) {
          const history = game.history({ verbose: true });
          const tempGame = new Chess();
          moveHistory = [];
          
          history.forEach(m => {
            tempGame.move(m);
            moveHistory.push({
              fen: tempGame.fen(),
              san: m.san,
              from: m.from,
              to: m.to
            });
          });

          currentMoveIndex = moveHistory.length - 1;
          board.position(game.fen());
          updateUI();
          showToast('PGN Loaded!');
        } else {
          showToast('Invalid PGN String');
        }
      });

      document.getElementById('btnCopyFen').addEventListener('click', () => {
        document.execCommand('copy');
        navigator.clipboard?.writeText(fenInput.value);
        showToast('FEN Copied!');
      });

      document.getElementById('btnCopyPgn').addEventListener('click', () => {
        document.execCommand('copy');
        navigator.clipboard?.writeText(pgnInput.value);
        showToast('PGN Copied!');
      });

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') jumpToMove(currentMoveIndex - 1);
        if (e.key === 'ArrowRight') jumpToMove(currentMoveIndex + 1);
        if (e.key === 'ArrowUp') jumpToMove(-1);
        if (e.key === 'ArrowDown') jumpToMove(moveHistory.length - 1);
      });

      updateUI();
    });
  </script>
</body>
</html>
