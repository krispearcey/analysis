<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lichess Analysis Board with Stockfish</title>

  <!-- Import Map to safely resolve ES modules in the browser -->
  <script type="importmap">
    {
      "imports": {
        "chessground": "https://cdn.jsdelivr.net/npm/chessground@9.2.1/+esm"
      }
    }
  </script>

  <!-- Chessground CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">

  <style>
    body {
      margin: 0;
      background-color: #161512;
      color: #bababa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: row;
      gap: 12px;
      padding: 20px;
      align-items: stretch;
    }

    /* Evaluation Bar Layout */
    .eval-bar-container {
      width: 24px;
      height: 500px;
      background: #403d39;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .eval-bar-white {
      background: #f0f0f0;
      width: 100%;
      height: 50%; /* Dynamic fill */
      transition: height 0.3s ease;
    }

    #board {
      width: 500px;
      height: 500px;
    }

    .sidebar {
      width: 320px;
      height: 500px;
      background: #262421;
      border-radius: 4px;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-top: 0;
      color: #fff;
      font-size: 1.1rem;
    }

    .engine-panel {
      background: #1e1c18;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 13px;
      border-left: 3px solid #888;
    }

    .move-list {
      flex-grow: 1;
      background: #1e1c18;
      padding: 10px;
      border-radius: 4px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .move-number {
      color: #7b7b7b;
      margin-right: 4px;
    }

    .move-item {
      margin-right: 12px;
      color: #e1e1e1;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      background: #363431;
      color: #ccc;
      border: 1px solid #403d39;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      flex: 1;
    }

    button:hover {
      background: #45433f;
      color: #fff;
    }

    .fen-box {
      background: #1e1c18;
      padding: 6px;
      border-radius: 4px;
      font-size: 10px;
      word-break: break-all;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Evaluation Bar -->
    <div class="eval-bar-container" title="Stockfish Evaluation">
      <div id="eval-bar-white" class="eval-bar-white"></div>
    </div>

    <!-- Main Board -->
    <div id="board" class="blue cburnett"></div>
    
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Analysis & Engine</h2>
      
      <!-- Engine Evaluation Info Panel -->
      <div class="engine-panel" id="engine-panel">
        <div><strong>Eval:</strong> <span id="eval-score">Initializing engine...</span></div>
        <div style="margin-top: 4px; color: #aaa; font-size: 11px;" id="engine-line">Best line: ...</div>
      </div>

      <div id="moves" class="move-list"></div>

      <div class="controls">
        <button id="reset-btn">Reset</button>
        <button id="flip-btn">Flip</button>
      </div>

      <div class="fen-box">
        <span id="fen-display"></span>
      </div>
    </div>
  </div>

  <!-- Load Chess Logic Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <!-- Main Logic Script -->
  <script type="module">
    import { Chessground } from 'chessground';

    const chess = new Chess();
    const boardElement = document.getElementById('board');
    const movesElement = document.getElementById('moves');
    const fenElement = document.getElementById('fen-display');
    const evalScoreElement = document.getElementById('eval-score');
    const engineLineElement = document.getElementById('engine-line');
    const evalBarWhite = document.getElementById('eval-bar-white');
    
    let orientation = 'white';

    // Initialize Stockfish Web Worker via CDN
    const stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');

    stockfish.postMessage('uci');
    stockfish.postMessage('isready');

    stockfish.onmessage = function(event) {
      const line = event.data;
      if (line.startsWith('info') && line.includes('score') && line.includes('pv')) {
        parseEngineInfo(line);
      }
    };

    function analyzePosition() {
      stockfish.postMessage('stop');
      stockfish.postMessage('position fen ' + chess.fen());
      stockfish.postMessage('go depth 15');
    }

    function parseEngineInfo(line) {
      let scoreMatch = line.match(/score (cp|mate) (-?\d+)/);
      let pvMatch = line.match(/pv (.+)/);

      let evalText = '0.0';
      let whiteWinPercentage = 50;

      if (scoreMatch) {
        let type = scoreMatch[1];
        let value = parseInt(scoreMatch[2]);

        if (type === 'cp') {
          let actualScore = chess.turn() === 'w' ? value : -value;
          evalText = (actualScore / 100).toFixed(2);
          if (actualScore > 0) evalText = '+' + evalText;
          whiteWinPercentage = 50 + 50 * (2 / (1 + Math.exp(-0.004 * actualScore)) - 1);
        } else if (type === 'mate') {
          let actualMate = chess.turn() === 'w' ? value : -value;
          evalText = 'M' + Math.abs(actualMate);
          whiteWinPercentage = actualMate > 0 ? 100 : 0;
        }
      }

      evalScoreElement.textContent = evalText;
      evalBarWhite.style.height = Math.max(0, Math.min(100, whiteWinPercentage)) + '%';

      if (pvMatch) {
        const moves = pvMatch[1].split(' ').slice(0, 5).join(' ');
        engineLineElement.textContent = 'Best line: ' + moves;
      }
    }

    function getDests(game) {
      const dests = new Map();
      game.SQUARES.forEach(s => {
        const ms = game.moves({ square: s, verbose: true });
        if (ms.length) dests.set(s, ms.map(m => m.to));
      });
      return dests;
    }

    const cg = Chessground(boardElement, {
      orientation: orientation,
      movable: {
        free: false,
        color: 'white',
        dests: getDests(chess),
        events: {
          after: (orig, dest) => {
            chess.move({ from: orig, to: dest, promotion: 'q' });
            updateBoard();
          }
        }
      }
    });

    function updateBoard() {
      cg.set({
        fen: chess.fen(),
        turnColor: chess.turn() === 'w' ? 'white' : 'black',
        movable: {
          color: chess.turn() === 'w' ? 'white' : 'black',
          dests: getDests(chess)
        },
        check: chess.in_check()
      });

      fenElement.textContent = chess.fen();

      const history = chess.history();
      movesElement.innerHTML = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const whiteMove = history[i] || '';
        const blackMove = history[i + 1] || '';

        const moveLine = document.createElement('div');
        moveLine.innerHTML = `<span class="move-number">${moveNum}.</span><span class="move-item">${whiteMove}</span><span class="move-item">${blackMove}</span>`;
        movesElement.appendChild(moveLine);
      }
      movesElement.scrollTop = movesElement.scrollHeight;

      analyzePosition();
    }

    updateBoard();

    document.getElementById('reset-btn').addEventListener('click', () => {
      chess.reset();
      updateBoard();
    });

    document.getElementById('flip-btn').addEventListener('click', () => {
      orientation = orientation === 'white' ? 'black' : 'white';
      cg.set({ orientation: orientation });
    });
  </script>
</body>
</html>
